; T-Watch S3 build for src/twatch_command_client.ino.
; Platform and library versions follow LilyGO's TTGO_TWatch_Library
; (t-watch-s3 branch) platformio.ini; the TFT_eSPI setup mirrors its
; extras/Setup212_LilyGo_T_Watch_S3.h.

[platformio]
default_envs = twatch-s3

[env:twatch-s3]
platform = espressif32@6.3.0
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
upload_speed = 921600
monitor_speed = 115200

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_INVERSION_ON=1
    -DTFT_MISO=-1
    -DTFT_MOSI=13
    -DTFT_SCLK=18
    -DTFT_CS=12
    -DTFT_DC=38
    -DTFT_RST=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DSPI_FREQUENCY=40000000

lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.3
    bodmer/TFT_eSPI @ 2.5.43
    lewisxhe/XPowersLib @ 0.2.4
    lewisxhe/SensorLib @ 0.3.4    ; BMA423 feature engine (raise to wake)

; Host-side unit tests for the hardware-independent code in lib/WatchCore:
;   pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -Werror
